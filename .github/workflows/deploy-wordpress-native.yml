name: Deploy FarmTree Native Private Runtime

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Enter the full approved commit SHA from feat/wordpress-native-rebuild"
        required: true
        type: string
      confirmation:
        description: "Type PRIVATE NATIVE FILES ONLY to deploy inactive native code"
        required: true
        type: string
      backup_confirmation:
        description: "Type RECOVERABLE FILE AND DB BACKUP VERIFIED before deployment"
        required: true
        type: string
      backup_reference:
        description: "Enter a non-secret evidence reference for the matching file and database restore point"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: farmtree-wordpress-native-private-runtime
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://farmtree.eu/

    steps:
      - name: Require explicit private-runtime confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          BACKUP_CONFIRMATION: ${{ inputs.backup_confirmation }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
        run: |
          test "$CONFIRMATION" = "PRIVATE NATIVE FILES ONLY"
          test "$BACKUP_CONFIRMATION" = "RECOVERABLE FILE AND DB BACKUP VERIFIED"
          test -n "${BACKUP_REFERENCE//[[:space:]]/}"
          reference_digest="$(printf '%s' "$BACKUP_REFERENCE" | sha256sum)"
          reference_digest="${reference_digest%% *}"
          printf '### FarmTree backup evidence\n- Reference SHA-256: `%s`\n' \
            "$reference_digest" >> "$GITHUB_STEP_SUMMARY"
          echo "FARMTREE_BACKUP_EVIDENCE_DIGEST_RECORDED"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0

      - name: Verify approved native source commit
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git fetch --no-tags origin refs/heads/feat/wordpress-native-rebuild
          git merge-base --is-ancestor "$SOURCE_COMMIT" FETCH_HEAD
          echo "FARMTREE_APPROVED_NATIVE_SOURCE_OK"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none

      - name: Validate native deployment source
        run: |
          npm ci
          npm test
          find wordpress/wp-content/themes/farmtree-native \
               wordpress/wp-content/plugins/farmtree-content \
               -type f -name '*.php' \
               -exec php -l {} \;

      - name: Validate production deployment configuration
        env:
          SSH_KEY: ${{ secrets.VIMEXX_SSH_KEY }}
          HOST: ${{ secrets.VIMEXX_HOST }}
          PORT: ${{ secrets.VIMEXX_PORT }}
          USERNAME: ${{ secrets.VIMEXX_USER }}
        run: |
          test -n "$SSH_KEY"
          test -n "$HOST"
          test -n "$PORT"
          test -n "$USERNAME"

      - name: Verify public rebuild safety
        run: |
          headers="$(mktemp)"
          body="$(mktemp)"
          curl -fsSL --max-time 20 -D "$headers" -o "$body" https://farmtree.eu/
          grep -qi "Coming Soon" "$body"
          if grep -qi "^x-robots-tag:.*noindex" "$headers"; then
            echo "FARMTREE_PUBLIC_NOINDEX_OK"
            exit 0
          fi
          if grep -Eqi "<meta[^>]+name=['\"]robots['\"][^>]+content=['\"][^'\"]*noindex" "$body"; then
            echo "FARMTREE_PUBLIC_NOINDEX_OK"
            exit 0
          fi
          echo "::error::Public Coming Soon response must include noindex before private runtime deployment."
          exit 1

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VIMEXX_SSH_KEY }}
          HOST: ${{ secrets.VIMEXX_HOST }}
          PORT: ${{ secrets.VIMEXX_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Discover and verify the primary-domain WordPress root
        env:
          HOST: ${{ secrets.VIMEXX_HOST }}
          PORT: ${{ secrets.VIMEXX_PORT }}
          USERNAME: ${{ secrets.VIMEXX_USER }}
        run: |
          set -Eeuo pipefail

          discovery_output="$(
            ssh \
              -i ~/.ssh/id_ed25519 \
              -p "$PORT" \
              "$USERNAME@$HOST" \
              'set -eu
              ssh_home="$(CDPATH= cd -- "$HOME" && pwd -P)"
              wordpress_candidate="$HOME/domains/farmtree.eu/public_html"
              test -d "$wordpress_candidate"
              wordpress_root="$(CDPATH= cd -- "$wordpress_candidate" && pwd -P)"
              test -d "$wordpress_root/wp-admin"
              test -d "$wordpress_root/wp-content"
              test -d "$wordpress_root/wp-includes"
              test -f "$wordpress_root/wp-config.php"
              printf "%s\n" "$ssh_home"
              printf "%s\n" "$wordpress_root"'
          )"
          mapfile -t discovered_paths <<< "$discovery_output"

          test "${#discovered_paths[@]}" -eq 2
          ssh_home="${discovered_paths[0]}"
          wordpress_root="${discovered_paths[1]}"
          [[ "$ssh_home" =~ ^/[A-Za-z0-9._/@+-]+$ ]]
          [[ "$wordpress_root" =~ ^/[A-Za-z0-9._/@+-]+$ ]]
          printf 'FARMTREE_SSH_HOME=%s\n' "$ssh_home"
          printf 'FARMTREE_RESOLVED_WORDPRESS_ROOT=%s\n' "$wordpress_root"
          printf 'WORDPRESS_ROOT=%s\n' "$wordpress_root" >> "$GITHUB_ENV"
          echo "FARMTREE_PRIMARY_ROOT_STRUCTURE_OK"

      - name: Verify private WordPress runtime boundary
        env:
          HOST: ${{ secrets.VIMEXX_HOST }}
          PORT: ${{ secrets.VIMEXX_PORT }}
          USERNAME: ${{ secrets.VIMEXX_USER }}
        run: |
          test -n "$WORDPRESS_ROOT"
          remote_wordpress_path="$(printf '%q' "$WORDPRESS_ROOT")"
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$PORT" \
            "$USERNAME@$HOST" \
            "set -eu
            test -f $remote_wordpress_path/wp-load.php
            command -v wp >/dev/null
            wp core is-installed --path=$remote_wordpress_path
            test \"\$(wp option get template --path=$remote_wordpress_path)\" = farmtree
            test \"\$(wp option get stylesheet --path=$remote_wordpress_path)\" = farmtree
            test \"\$(wp option get blog_public --path=$remote_wordpress_path)\" = 0
            wp plugin is-active coming-soon --path=$remote_wordpress_path
            if wp plugin is-active farmtree-content --path=$remote_wordpress_path; then
              echo FARMTREE_CONTENT_PLUGIN_MUST_REMAIN_INACTIVE
              exit 1
            fi
            test -d $remote_wordpress_path/wp-content/themes/farmtree
            echo CURRENT_THEME_FARMTREE_AND_PRIVATE_RUNTIME_OK"

      - name: Record native code presence before deployment
        env:
          HOST: ${{ secrets.VIMEXX_HOST }}
          PORT: ${{ secrets.VIMEXX_PORT }}
          USERNAME: ${{ secrets.VIMEXX_USER }}
        run: |
          test -n "$WORDPRESS_ROOT"
          remote_wordpress_path="$(printf '%q' "$WORDPRESS_ROOT")"
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$PORT" \
            "$USERNAME@$HOST" \
            "set -eu
            if wp theme is-installed farmtree-native --path=$remote_wordpress_path; then
              echo FARMTREE_NATIVE_THEME_ALREADY_PRESENT
            else
              echo FARMTREE_NATIVE_THEME_NOT_PRESENT
            fi
            if wp plugin is-installed farmtree-content --path=$remote_wordpress_path; then
              echo FARMTREE_CONTENT_PLUGIN_ALREADY_PRESENT
            else
              echo FARMTREE_CONTENT_PLUGIN_NOT_PRESENT
            fi"

      - name: Create native code directories
        env:
          HOST: ${{ secrets.VIMEXX_HOST }}
          PORT: ${{ secrets.VIMEXX_PORT }}
          USERNAME: ${{ secrets.VIMEXX_USER }}
        run: |
          test -n "$WORDPRESS_ROOT"
          remote_wordpress_path="$(printf '%q' "$WORDPRESS_ROOT")"
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$PORT" \
            "$USERNAME@$HOST" \
            "mkdir -p \
              $remote_wordpress_path/wp-content/themes/farmtree-native \
              $remote_wordpress_path/wp-content/plugins/farmtree-content"

      - name: Deploy inactive FarmTree Native theme
        env:
          HOST: ${{ secrets.VIMEXX_HOST }}
          PORT: ${{ secrets.VIMEXX_PORT }}
          USERNAME: ${{ secrets.VIMEXX_USER }}
        run: |
          test -n "$WORDPRESS_ROOT"
          # --delete is scoped to the farmtree-native destination only.
          rsync -az --delete --protect-args \
            -e "ssh -i ~/.ssh/id_ed25519 -p $PORT" \
            wordpress/wp-content/themes/farmtree-native/ \
            "$USERNAME@$HOST:$WORDPRESS_ROOT/wp-content/themes/farmtree-native/"

      - name: Deploy inactive FarmTree Content plugin
        env:
          HOST: ${{ secrets.VIMEXX_HOST }}
          PORT: ${{ secrets.VIMEXX_PORT }}
          USERNAME: ${{ secrets.VIMEXX_USER }}
        run: |
          test -n "$WORDPRESS_ROOT"
          # --delete is scoped to the farmtree-content destination only.
          rsync -az --delete --protect-args \
            -e "ssh -i ~/.ssh/id_ed25519 -p $PORT" \
            wordpress/wp-content/plugins/farmtree-content/ \
            "$USERNAME@$HOST:$WORDPRESS_ROOT/wp-content/plugins/farmtree-content/"

      - name: Verify inactive native code on WordPress
        env:
          HOST: ${{ secrets.VIMEXX_HOST }}
          PORT: ${{ secrets.VIMEXX_PORT }}
          USERNAME: ${{ secrets.VIMEXX_USER }}
        run: |
          test -n "$WORDPRESS_ROOT"
          remote_wordpress_path="$(printf '%q' "$WORDPRESS_ROOT")"
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$PORT" \
            "$USERNAME@$HOST" \
            "set -eu
            test -f $remote_wordpress_path/wp-content/themes/farmtree-native/style.css
            test -f $remote_wordpress_path/wp-content/themes/farmtree-native/theme.json
            test -f $remote_wordpress_path/wp-content/themes/farmtree-native/functions.php
            test -f $remote_wordpress_path/wp-content/plugins/farmtree-content/farmtree-content.php
            wp theme is-installed farmtree-native --path=$remote_wordpress_path
            wp plugin is-installed farmtree-content --path=$remote_wordpress_path
            if wp theme is-active farmtree-native --path=$remote_wordpress_path; then
              echo FARMTREE_NATIVE_THEME_MUST_REMAIN_INACTIVE
              exit 1
            fi
            if wp plugin is-active farmtree-content --path=$remote_wordpress_path; then
              echo FARMTREE_CONTENT_PLUGIN_MUST_REMAIN_INACTIVE
              exit 1
            fi
            wp eval 'if (!wp_get_theme(\"farmtree-native\")->is_block_theme()) { exit(1); }' --path=$remote_wordpress_path
            echo FARMTREE_NATIVE_PRIVATE_RUNTIME_CODE_OK"
