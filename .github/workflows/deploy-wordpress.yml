name: Retired FarmTree Legacy Deployment (Blocked)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farmtree-wordpress-production
  cancel-in-progress: false

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse obsolete legacy deployment
        run: |
          echo '::error::Legacy deployment is retired. It must not overwrite the farmtree rollback theme. Use the approved tracked theme-only post-launch runner; historical implementation remains in Git history.'
          exit 1
