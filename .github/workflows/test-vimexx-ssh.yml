name: Test Vimexx SSH Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VIMEXX_SSH_KEY }}
          HOST: ${{ secrets.VIMEXX_HOST }}
          PORT: ${{ secrets.VIMEXX_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test Vimexx connection
        env:
          HOST: ${{ secrets.VIMEXX_HOST }}
          PORT: ${{ secrets.VIMEXX_PORT }}
          USERNAME: ${{ secrets.VIMEXX_USER }}
          WORDPRESS_PATH: ${{ secrets.VIMEXX_WORDPRESS_PATH }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$PORT" \
            "$USERNAME@$HOST" \
            "echo 'SSH_CONNECTION_OK'; whoami; pwd; test -d '$WORDPRESS_PATH' && echo 'WORDPRESS_PATH_OK'"
