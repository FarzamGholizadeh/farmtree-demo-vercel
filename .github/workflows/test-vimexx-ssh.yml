name: Apply FarmTree Coming Soon Noindex Safety

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose the bounded private-runtime operation"
        required: true
        default: verify-primary-root
        type: choice
        options:
          - verify-primary-root
          - apply-noindex
          - validate-inactive-runtime

permissions:
  contents: read

concurrency:
  group: farmtree-coming-soon-noindex-safety
  cancel-in-progress: false

jobs:
  verify-primary-root:
    if: ${{ inputs.operation == 'verify-primary-root' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://farmtree.eu/

    steps:
      - name: Validate SSH configuration
        env:
          SSH_KEY: ${{ secrets.VIMEXX_SSH_KEY }}
          HOST: ${{ secrets.VIMEXX_HOST }}
          PORT: ${{ secrets.VIMEXX_PORT }}
          USERNAME: ${{ secrets.VIMEXX_USER }}
        run: |
          test -n "$SSH_KEY"
          test -n "$HOST"
          test -n "$PORT"
          test -n "$USERNAME"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VIMEXX_SSH_KEY }}
          HOST: ${{ secrets.VIMEXX_HOST }}
          PORT: ${{ secrets.VIMEXX_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Discover and verify the primary-domain WordPress root without WP-CLI
        env:
          HOST: ${{ secrets.VIMEXX_HOST }}
          PORT: ${{ secrets.VIMEXX_PORT }}
          USERNAME: ${{ secrets.VIMEXX_USER }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$PORT" \
            "$USERNAME@$HOST" \
            'set -eu
            ssh_home="$(CDPATH= cd -- "$HOME" && pwd -P)"
            wordpress_candidate="$HOME/domains/farmtree.eu/public_html"
            test -d "$wordpress_candidate"
            wordpress_root="$(CDPATH= cd -- "$wordpress_candidate" && pwd -P)"
            test -d "$wordpress_root/wp-admin"
            test -d "$wordpress_root/wp-content"
            test -d "$wordpress_root/wp-includes"
            test -f "$wordpress_root/wp-config.php"
            printf "FARMTREE_SSH_HOME=%s\n" "$ssh_home"
            printf "FARMTREE_RESOLVED_WORDPRESS_ROOT=%s\n" "$wordpress_root"
            echo FARMTREE_PRIMARY_ROOT_STRUCTURE_OK'

  noindex-safety:
    if: ${{ inputs.operation == 'apply-noindex' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://farmtree.eu/

    steps:
      - name: Validate production configuration
        env:
          SSH_KEY: ${{ secrets.VIMEXX_SSH_KEY }}
          HOST: ${{ secrets.VIMEXX_HOST }}
          PORT: ${{ secrets.VIMEXX_PORT }}
          USERNAME: ${{ secrets.VIMEXX_USER }}
          WORDPRESS_PATH: ${{ secrets.VIMEXX_WORDPRESS_PATH }}
        run: |
          test -n "$SSH_KEY"
          test -n "$HOST"
          test -n "$PORT"
          test -n "$USERNAME"
          test -n "$WORDPRESS_PATH"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VIMEXX_SSH_KEY }}
          HOST: ${{ secrets.VIMEXX_HOST }}
          PORT: ${{ secrets.VIMEXX_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Apply and verify frontend-only noindex header
        env:
          HOST: ${{ secrets.VIMEXX_HOST }}
          PORT: ${{ secrets.VIMEXX_PORT }}
          USERNAME: ${{ secrets.VIMEXX_USER }}
          WORDPRESS_PATH: ${{ secrets.VIMEXX_WORDPRESS_PATH }}
        run: |
          set -Eeuo pipefail

          remote_wordpress_path="$(printf '%q' "$WORDPRESS_PATH")"
          remote_backup="/tmp/farmtree-htaccess-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bak"
          remote_backup_quoted="$(printf '%q' "$remote_backup")"
          remote_candidate="$WORDPRESS_PATH/.htaccess.farmtree-noindex-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tmp"
          remote_candidate_quoted="$(printf '%q' "$remote_candidate")"
          ssh_target="$USERNAME@$HOST"
          ssh_args=(-i ~/.ssh/id_ed25519 -p "$PORT")
          applied=0

          rollback() {
            if [ "$applied" -eq 1 ]; then
              ssh "${ssh_args[@]}" "$ssh_target" \
                "set -eu
                if test -f $remote_backup_quoted; then
                  cp -p $remote_backup_quoted $remote_wordpress_path/.htaccess
                fi
                rm -f $remote_backup_quoted $remote_candidate_quoted"
              echo "FARMTREE_NOINDEX_ROLLED_BACK"
            fi
          }
          trap rollback ERR INT TERM
          applied=1

          ssh "${ssh_args[@]}" "$ssh_target" \
            "set -eu
            test -f $remote_wordpress_path/wp-load.php
            test -f $remote_wordpress_path/.htaccess
            command -v wp >/dev/null
            wp core is-installed --path=$remote_wordpress_path
            echo FARMTREE_NOINDEX_PREFLIGHT_WORDPRESS_OK
            test \"\$(wp option get template --path=$remote_wordpress_path)\" = farmtree
            test \"\$(wp option get stylesheet --path=$remote_wordpress_path)\" = farmtree
            echo FARMTREE_NOINDEX_PREFLIGHT_THEME_OK
            wp option get blog_public --path=$remote_wordpress_path >/dev/null
            echo FARMTREE_NOINDEX_PREFLIGHT_SEARCH_VISIBILITY_READ_ONLY
            wp plugin is-active coming-soon --path=$remote_wordpress_path
            echo FARMTREE_NOINDEX_PREFLIGHT_COMING_SOON_OK
            ! grep -Fqx '# BEGIN FarmTree rebuild noindex' $remote_wordpress_path/.htaccess
            echo FARMTREE_NOINDEX_PREFLIGHT_MARKER_ABSENT
            cp -p $remote_wordpress_path/.htaccess $remote_backup_quoted
            cp -p $remote_wordpress_path/.htaccess $remote_candidate_quoted
            printf '\n%s\n%s\n%s\n%s\n%s\n' \
              '# BEGIN FarmTree rebuild noindex' \
              '<IfModule mod_headers.c>' \
              'Header always set X-Robots-Tag \"noindex, nofollow\" \"expr=%{REQUEST_URI} !~ m#^/(wp-admin(/|$)|wp-login\\.php(/|$))#\"' \
              '</IfModule>' \
              '# END FarmTree rebuild noindex' >> $remote_candidate_quoted
            mv $remote_candidate_quoted $remote_wordpress_path/.htaccess"
          echo "FARMTREE_NOINDEX_RULE_APPLIED_PENDING_HTTP_VERIFICATION"

          cache_bust="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          home_headers="$(mktemp)"
          home_body="$(mktemp)"
          robots_headers="$(mktemp)"
          login_headers="$(mktemp)"
          login_body="$(mktemp)"
          admin_headers="$(mktemp)"

          home_status="$(curl -sS --max-time 30 \
            -D "$home_headers" \
            -o "$home_body" \
            -w '%{http_code}' \
            "https://farmtree.eu/?farmtree_noindex_check=$cache_bust")"
          echo "FARMTREE_NOINDEX_HOME_STATUS=$home_status"
          test "$home_status" = 200
          grep -qi 'Coming Soon' "$home_body"
          home_header_count="$(tr -d '\r' < "$home_headers" | grep -Eic '^x-robots-tag:[[:space:]]*noindex,[[:space:]]*nofollow[[:space:]]*$' || true)"
          echo "FARMTREE_NOINDEX_HOME_HEADER_COUNT=$home_header_count"
          test "$home_header_count" -eq 1

          robots_status="$(curl -sS --max-time 30 \
            -D "$robots_headers" \
            -o /dev/null \
            -w '%{http_code}' \
            "https://farmtree.eu/robots.txt?farmtree_noindex_check=$cache_bust")"
          echo "FARMTREE_NOINDEX_ROBOTS_STATUS=$robots_status"
          test "$robots_status" = 200
          robots_header_count="$(tr -d '\r' < "$robots_headers" | grep -Eic '^x-robots-tag:[[:space:]]*noindex,[[:space:]]*nofollow[[:space:]]*$' || true)"
          echo "FARMTREE_NOINDEX_ROBOTS_HEADER_COUNT=$robots_header_count"
          test "$robots_header_count" -eq 1

          login_status="$(curl -sS --max-time 30 \
            -D "$login_headers" \
            -o "$login_body" \
            -w '%{http_code}' \
            "https://farmtree.eu/wp-login.php?farmtree_noindex_check=$cache_bust")"
          echo "FARMTREE_NOINDEX_LOGIN_STATUS=$login_status"
          test "$login_status" = 200
          grep -qi 'id="loginform"' "$login_body"
          ! grep -Eqi '^x-robots-tag:' "$login_headers"

          admin_status="$(curl -sS --max-time 30 \
            -D "$admin_headers" \
            -o /dev/null \
            -w '%{http_code}' \
            "https://farmtree.eu/wp-admin/?farmtree_noindex_check=$cache_bust")"
          echo "FARMTREE_NOINDEX_ADMIN_STATUS=$admin_status"
          [[ "$admin_status" =~ ^30[12378]$ ]]
          grep -Eqi '^location:.*wp-login\.php' "$admin_headers"
          ! grep -Eqi '^x-robots-tag:' "$admin_headers"

          ssh "${ssh_args[@]}" "$ssh_target" \
            "set -eu
            test \"\$(wp option get template --path=$remote_wordpress_path)\" = farmtree
            test \"\$(wp option get stylesheet --path=$remote_wordpress_path)\" = farmtree
            wp plugin is-active coming-soon --path=$remote_wordpress_path
            grep -Fqx '# BEGIN FarmTree rebuild noindex' $remote_wordpress_path/.htaccess
            grep -Fqx '# END FarmTree rebuild noindex' $remote_wordpress_path/.htaccess
            rm -f $remote_backup_quoted"

          applied=0
          trap - ERR INT TERM
          echo "FARMTREE_PUBLIC_NOINDEX_NOFOLLOW_OK"
          echo "FARMTREE_LOGIN_AND_ADMIN_EXCLUDED_OK"
          echo "FARMTREE_COMING_SOON_PRESERVED"

  validate-inactive-runtime:
    if: ${{ inputs.operation == 'validate-inactive-runtime' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://farmtree.eu/

    steps:
      - name: Checkout runtime validator
        uses: actions/checkout@v4

      - name: Validate production configuration
        env:
          SSH_KEY: ${{ secrets.VIMEXX_SSH_KEY }}
          HOST: ${{ secrets.VIMEXX_HOST }}
          PORT: ${{ secrets.VIMEXX_PORT }}
          USERNAME: ${{ secrets.VIMEXX_USER }}
          WORDPRESS_PATH: ${{ secrets.VIMEXX_WORDPRESS_PATH }}
        run: |
          test -n "$SSH_KEY"
          test -n "$HOST"
          test -n "$PORT"
          test -n "$USERNAME"
          test -n "$WORDPRESS_PATH"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VIMEXX_SSH_KEY }}
          HOST: ${{ secrets.VIMEXX_HOST }}
          PORT: ${{ secrets.VIMEXX_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Validate installed inactive native packages in WordPress
        env:
          HOST: ${{ secrets.VIMEXX_HOST }}
          PORT: ${{ secrets.VIMEXX_PORT }}
          USERNAME: ${{ secrets.VIMEXX_USER }}
          WORDPRESS_PATH: ${{ secrets.VIMEXX_WORDPRESS_PATH }}
        run: |
          set -Eeuo pipefail

          remote_wordpress_path="$(printf '%q' "$WORDPRESS_PATH")"
          remote_script="/tmp/farmtree-native-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.php"
          remote_script_quoted="$(printf '%q' "$remote_script")"
          ssh_target="$USERNAME@$HOST"
          ssh_args=(-i ~/.ssh/id_ed25519 -p "$PORT")

          ssh "${ssh_args[@]}" "$ssh_target" \
            "set -eu
            test -f $remote_wordpress_path/wp-load.php
            command -v wp >/dev/null
            wp core is-installed --path=$remote_wordpress_path
            test \"\$(wp option get template --path=$remote_wordpress_path)\" = farmtree
            test \"\$(wp option get stylesheet --path=$remote_wordpress_path)\" = farmtree
            wp option get blog_public --path=$remote_wordpress_path >/dev/null
            wp plugin is-active coming-soon --path=$remote_wordpress_path
            wp theme is-installed farmtree-native --path=$remote_wordpress_path
            ! wp theme is-active farmtree-native --path=$remote_wordpress_path
            wp plugin is-installed farmtree-content --path=$remote_wordpress_path
            ! wp plugin is-active farmtree-content --path=$remote_wordpress_path"

          scp \
            -i ~/.ssh/id_ed25519 \
            -P "$PORT" \
            .github/scripts/validate-native-runtime.php \
            "$ssh_target:$remote_script"

          ssh "${ssh_args[@]}" "$ssh_target" \
            "set -eu
            trap 'rm -f $remote_script_quoted' EXIT
            php -l $remote_script_quoted
            administrator_id=\"\$(wp user list --role=administrator --field=ID --path=$remote_wordpress_path | head -n 1)\"
            test -n \"\$administrator_id\"
            wp eval-file $remote_script_quoted $GITHUB_RUN_ID --user=\"\$administrator_id\" --path=$remote_wordpress_path"

      - name: Reverify private public boundary
        run: |
          set -Eeuo pipefail

          cache_bust="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          home_headers="$(mktemp)"
          home_body="$(mktemp)"
          login_headers="$(mktemp)"
          login_body="$(mktemp)"

          home_status="$(curl -sS --max-time 30 \
            -D "$home_headers" \
            -o "$home_body" \
            -w '%{http_code}' \
            "https://farmtree.eu/?farmtree_runtime_check=$cache_bust")"
          test "$home_status" = 200
          grep -qi 'Coming Soon' "$home_body"
          test "$(tr -d '\r' < "$home_headers" | grep -Eic '^x-robots-tag:[[:space:]]*noindex,[[:space:]]*nofollow[[:space:]]*$')" -eq 1

          login_status="$(curl -sS --max-time 30 \
            -D "$login_headers" \
            -o "$login_body" \
            -w '%{http_code}' \
            "https://farmtree.eu/wp-login.php?farmtree_runtime_check=$cache_bust")"
          test "$login_status" = 200
          grep -qi 'id="loginform"' "$login_body"
          ! grep -Eqi '^x-robots-tag:' "$login_headers"

          echo "FARMTREE_INACTIVE_RUNTIME_VALIDATION_OK"
          echo "FARMTREE_COMING_SOON_AND_NOINDEX_PRESERVED"
