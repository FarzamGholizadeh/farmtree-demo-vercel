name: Validate FarmTree Native WordPress

on:
  push:
    branches:
      - feat/wordpress-native-rebuild
    paths:
      - ".github/workflows/deploy-wordpress-native.yml"
      - ".github/workflows/validate-wordpress-native.yml"
      - "wordpress/wp-content/themes/farmtree-native/**"
      - "wordpress/wp-content/plugins/farmtree-content/**"
      - "scripts/validate-native-*.mjs"
      - "package.json"
      - "package-lock.json"
      - "stylelint.config.mjs"
  pull_request:
    paths:
      - ".github/workflows/deploy-wordpress-native.yml"
      - ".github/workflows/validate-wordpress-native.yml"
      - "wordpress/wp-content/themes/farmtree-native/**"
      - "wordpress/wp-content/plugins/farmtree-content/**"
      - "scripts/validate-native-*.mjs"
      - "package.json"
      - "package-lock.json"
      - "stylelint.config.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none

      - name: Install validation dependencies
        run: npm ci

      - name: Validate PHP syntax
        run: |
          find wordpress/wp-content/themes/farmtree-native \
               wordpress/wp-content/plugins/farmtree-content \
               -type f -name '*.php' \
               -exec php -l {} \;

      - name: Validate native theme, plugin, workflows, JavaScript and CSS
        run: npm test

  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
